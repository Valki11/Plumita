<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex-shrink:0;padding:52px 18px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--color-divider);box-sizing:border-box;font-family:var(--font-body);color:var(--color-text)">

</div>
<div>
<div style="font-family:var(--font-heading);font-size:16px;line-height:1.1">Plumita</div>
<div style="font-size:12px;opacity:0.6">{{ title }}</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:90},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
