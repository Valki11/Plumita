<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex-shrink:0;display:flex;border-top:1px solid var(--color-divider);background:var(--color-bg);padding:8px 4px 26px;box-sizing:border-box;font-family:var(--font-body)">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cInicio }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span style="font-size:10.5px">Inicio</span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cAves }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg><span style="font-size:10.5px">Mis aves</span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cAlimentar }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M4 11c0-3 3.5-7 8-7s8 4 8 7"/></svg><span style="font-size:10.5px">Alimentar</span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cInventario }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span style="font-size:10.5px">Inventario</span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cConfig }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v4M12 17v4M4.2 4.2l2.9 2.9M16.9 16.9l2.9 2.9M3 12h4M17 12h4M4.2 19.8l2.9-2.9M16.9 7.1l2.9-2.9"/></svg><span style="font-size:10.5px">Ajustes</span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;aves&quot;,&quot;alimentar&quot;,&quot;inventario&quot;,&quot;config&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'inicio';
    const on = 'var(--color-accent-700)';
    const off = 'color-mix(in srgb, var(--color-text) 45%, transparent)';
    const c = k => (active === k ? on : off);
    return { cInicio: c('inicio'), cAves: c('aves'), cAlimentar: c('alimentar'), cInventario: c('inventario'), cConfig: c('config') };
  }
}

</script>
</body>
</html>
